# Vercel FastAPI project metadata (API deploy from repository root).
# Frontend continues to use Root Directory = frontend/ with frontend/vercel.json.
#
# IMPORTANT: Vercel's Python runtime (uv) installs from this file when it exists.
# An empty [project] table causes zero runtime packages to be installed and
# requirements.txt is not used. Keep [project.dependencies] aligned with
# root requirements.txt (runtime only; pytest stays in backend/requirements.txt).

[project]
name = "houseprice-insight-api"
version = "1.1.0"
description = "HousePrice Insight FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.3.6",
  "pydantic[email]==2.10.6",
  "PyJWT==2.15.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.32",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
